{% load static %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <header class="header">
        <div class="logo">СайтРу</div>
        <nav class="nav">
            <a href="{% url 'index' %}">Главная</a>
            <a href="{% url 'about' %}">О нас</a>
            <a href="{% url 'services' %}">Услуги</a>
            <a href="{% url 'contacts' %}" class="active">Контакты</a>
            <a href="{% url 'auth' %}">Войти</a>
            <a href="{% url 'profile' %}">Профиль</a>
        </nav>
        <button id="theme-btn" class="theme-toogle">🌛</button>
    </header>

    <main class="content">
        <h1>Связаться с нами</h1>
        <p>Заполните форму ниже, и мы свяжемся в самое ближайшее время!</p>

        <form class="contact-form">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="email">Ваш Email</label>
                <input type="email" id="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea id="message" rows="5" placeholder="Напишите ваше сообщение..." required></textarea>
            </div>

            <button type="submit" class="btn">Отправить сообщение ✨</button>
        </form>
    </main>

    <footer class="footer">
        <p>© 2026 Все права защищены ✨</p>
    </footer>
    <script src="{% static 'script.js' %}"></script>
    </body>
</html>
